# Merged pull requests to open-source projects, rendered by
# _includes/open_source.liquid on the /contributions/ page, newest first.
# Add one record per merged PR.
#   title:     the change in a few plain words (not the raw PR title)
#   logo_fill: true -> the logo is a full-bleed square (no white padding)

- repo: vllm-project/guidellm
  project: vLLM GuideLLM
  logo: vllm.png
  pr: 1455
  merged: "2026-11-13"
  title: Prevent multimodal cache reuse across benchmark runs
  impact: >-
    Every benchmark in a sweep resent the first benchmark's synthetic images
    and videos, so vLLM answered from its multimodal cache and later runs
    looked faster than they were. Seeding the media per benchmark cut cache
    hits from 480 of 720 to 0 (Qwen3-VL-2B on one L4, concurrency 16).

- repo: harbor-framework/harbor
  project: Harbor
  logo: harbor.png
  logo_fill: true
  pr: 1635
  merged: "2026-07-28"
  title: Add the LoCoMo conversational memory benchmark
  impact: >-
    Ported Snap Research's LoCoMo long-term memory benchmark (10
    conversations, 1,986 questions) and verified parity with the original
    implementation over 5 runs per side (overall F1 0.533 vs 0.549).

- repo: harbor-framework/terminal-bench-1
  project: Terminal-Bench
  logo: terminal_bench.png
