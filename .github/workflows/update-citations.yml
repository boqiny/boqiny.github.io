name: Update citations

# Every 6 hours: re-read the Google Scholar profile into _data/citations.yml
# and redeploy if any number changed. Google blocks some runner IPs but not
# others, so several tries a day keep the numbers at most about a day old.
# Commits made with GITHUB_TOKEN do not trigger the push-based deploy, so
# this dispatches deploy.yml explicitly.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Google sometimes rate-limits runner IPs. A miss keeps the last good
      # numbers and is only a warning; the next step fails if data goes stale.
      - name: Fetch Google Scholar profile
        id: fetch
        continue-on-error: true
        run: python3 bin/update_citations.py

      - name: Warn on fetch failure, fail if data is over 3 weeks old
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar fetch failed; keeping existing citations.yml"
          last=$(sed -n 's/^  last_updated: "\(.*\)"/\1/p' _data/citations.yml)
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "citations.yml is $age days old"
          [ "$age" -le 21 ]

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "Update Google Scholar citations"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
